<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="pipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 L0 0 0 34" fill="none" stroke="#1e2a44" stroke-width="0.6"/>
    </pattern>

    <clipPath id="frame"><rect width="900" height="220" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="220" fill="url(#bg)"/>
    <rect width="900" height="220" fill="url(#grid)" opacity="0.5"/>

    <!-- ===== CI/CD pipeline line ===== -->
    <g transform="translate(0,178)">
      <line x1="70" y1="0" x2="830" y2="0" stroke="url(#pipe)" stroke-width="4" stroke-linecap="round"/>

      <!-- moving packet -->
      <circle r="4" fill="#22d3ee" filter="url(#soft)">
        <animate attributeName="cx" values="70;830" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="0" dur="4s" repeatCount="indefinite"/>
      </circle>

      <!-- stages -->
      <g font-family="'Courier New', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">
        <g>
          <circle cx="120" cy="0" r="7" fill="#0b1120" stroke="#38bdf8" stroke-width="2"/>
          <text x="120" y="20">Code</text>
        </g>
        <g>
          <circle cx="298" cy="0" r="7" fill="#0b1120" stroke="#818cf8" stroke-width="2"/>
          <text x="298" y="20">Build</text>
        </g>
        <g>
          <circle cx="476" cy="0" r="7" fill="#0b1120" stroke="#22d3ee" stroke-width="2"/>
          <text x="476" y="20">Test</text>
        </g>
        <g>
          <circle cx="654" cy="0" r="7" fill="#0b1120" stroke="#38bdf8" stroke-width="2"/>
          <text x="654" y="20">Deploy</text>
        </g>
        <g>
          <circle cx="780" cy="0" r="7" fill="#0b1120" stroke="#34d399" stroke-width="2">
            <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
          </circle>
          <text x="780" y="20" fill="#34d399">Monitor</text>
        </g>
      </g>
    </g>

    <!-- ===== terminal prompt line ===== -->
    <text x="70" y="46" font-family="'Courier New', monospace" font-size="13" fill="#64748b">
      <tspan fill="#34d399">mariam@devops</tspan>:<tspan fill="#38bdf8">~</tspan>$ whoami
    </text>

    <!-- ===== name ===== -->
    <text x="70" y="92" font-family="'Segoe UI', Arial, sans-serif" font-size="40" font-weight="700"
          fill="url(#accent)" filter="url(#soft)" opacity="0">
      Mariam KONÉ
      <animate attributeName="opacity" values="0;1" dur="1s" begin="0.3s" fill="freeze"/>
    </text>

    <!-- ===== role ===== -->
    <text x="72" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#e2e8f0" opacity="0">
      DevOps / Cloud Engineer
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.8s" fill="freeze"/>
    </text>

    <!-- ===== tags ===== -->
    <text x="72" y="145" font-family="'Courier New', monospace" font-size="12.5" fill="#38bdf8" opacity="0">
      CI/CD · Kubernetes · Docker · Terraform · AWS · IaC
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.2s" fill="freeze"/>
    </text>

    <!-- ===== availability pill (top right) ===== -->
    <g transform="translate(690,34)" opacity="0">
      <rect width="150" height="26" rx="13" fill="#0b1120" stroke="#34d399" stroke-width="1"/>
      <circle cx="18" cy="13" r="4" fill="#34d399">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="17" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#a7f3d0">
        Open to work
      </text>
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.5s" fill="freeze"/>
    </g>

    <!-- ===== location / student (top right, second line) ===== -->
 

    <rect x="0.5" y="0.5" width="899" height="219" rx="14" fill="none" stroke="#1e293b" stroke-width="1"/>
  </g>
</svg>
